
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RD Studio | Admin Dashboard</title>

  <style>
    :root {
      --oat: #F5F0E6;
      --sage: #A9B99A;
      --deep-sage: #66765B;
      --coffee: #493A33;
      --white: #FFFCF7;
      --muted: #75685F;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--oat);
      color: var(--coffee);
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 20px 7%;
      background: var(--white);
      border-bottom: 1px solid #e6ddcf;
    }

    header h1 {
      font-size: 25px;
      color: var(--deep-sage);
    }

    header p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 9px;
      background: var(--deep-sage);
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: var(--coffee);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .logout-btn {
      background: var(--coffee);
    }

    main {
      width: min(1100px, 90%);
      margin: 40px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 9px;
      font-size: 28px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      padding: 22px;
      border: 1px solid #e6ddcf;
      border-radius: 15px;
      background: var(--white);
    }

    .stat-card p {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .stat-card h3 {
      font-size: 30px;
      color: var(--deep-sage);
    }

    .messages-section {
      padding: 22px;
      border: 1px solid #e6ddcf;
      border-radius: 16px;
      background: var(--white);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .section-heading h2 {
      font-size: 21px;
    }

    #dashboard-status {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message-list {
      display: grid;
      gap: 15px;
    }

    .message-card {
      padding: 18px;
      border: 1px solid #e6ddcf;
      border-radius: 12px;
      background: #fffefa;
      overflow-wrap: anywhere;
    }

    .message-card h3 {
      margin-bottom: 8px;
      font-size: 17px;
    }

    .message-email {
      margin-bottom: 10px;
      color: var(--deep-sage);
      font-size: 14px;
    }

    .message-text {
      margin: 12px 0;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .message-date {
      color: var(--muted);
      font-size: 12px;
    }

    .empty-state {
      padding: 25px 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    footer {
      padding: 25px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 5%;
      }

      header h1 {
        font-size: 22px;
      }

      main {
        width: 92%;
        margin: 25px auto;
      }

      .welcome h2 {
        font-size: 24px;
      }

      .messages-section {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>RD Studio ♡</h1>
      <p>Private Admin Dashboard</p>
    </div>

    <div class="header-actions">
      <button id="refresh-btn" type="button">Refresh Messages ↻</button>
      <button id="logout-btn" class="logout-btn" type="button">
        Logout
      </button>
    </div>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome back, Reshma! 🌿</h2>
      <p>Manage the messages people send through your website.</p>
    </section>

    <section class="stats">
      <article class="stat-card">
        <p>Total Inquiries</p>
        <h3 id="total-count">—</h3>
      </article>

      <article class="stat-card">
        <p>Latest Messages</p>
        <h3 id="latest-count">—</h3>
      </article>
    </section>

    <section class="messages-section">
      <div class="section-heading">
        <h2>Customer Messages 💌</h2>
      </div>

      <p id="dashboard-status" role="status" aria-live="polite">
        Loading messages...
      </p>

      <div id="message-list" class="message-list"></div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> RD Studio · Made with care ♡
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
