<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>RD Studio | Reset Password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #F5F0E6;
      color: #493A33;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px;
      background: #FFFCF7;
      border: 1px solid #e6ddcf;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(73, 58, 51, 0.08);
    }
    h1 { margin: 0 0 8px; color: #66765B; font-size: 30px; text-align: center; }
    h1 a { color: inherit; text-decoration: none; }
    h2 { margin: 28px 0 8px; font-size: 22px; }
    p { color: #75685F; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8cfc2;
      border-radius: 10px;
      color: #493A33;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #66765B; }
    .show-password { font-weight: normal; }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #66765B;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #493A33; }
    button:disabled { opacity: 0.65; cursor: wait; }
    #reset-status { overflow-wrap: anywhere; }
    a { color: #66765B; }
  </style>
</head>
<body>
  <main>
    <h1><a href="index.html">RD Studio ♡</a></h1>
    <h2>Reset password</h2>
    <p id="reset-status" role="status" aria-live="polite">Checking your recovery link...</p>
    <form id="reset-form" hidden>
      <label for="new-password">New password</label>
      <input type="password" id="new-password" autocomplete="new-password" required>
      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" autocomplete="new-password" required>
      <label class="show-password">
        <input type="checkbox" id="show-password"> Show passwords
      </label>
      <button type="submit" id="reset-btn">Update password</button>
    </form>
    <p><a href="admin.html">Back to Admin Login</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./reset-password.js"></script>
</body>
</html>
